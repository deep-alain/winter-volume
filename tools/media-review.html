<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>冬日音量键 · 循环成片检查</title><style>body{margin:0;background:#25374a;color:#f7faf9;font:16px system-ui;padding:24px}main{max-width:1100px;margin:auto}h1{font-size:24px;font-weight:500}section{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}video{width:432px;max-width:90vw;display:block}img{width:430px;max-width:90vw;height:auto}p{line-height:1.6}button{padding:10px 18px;font:inherit;border:0;border-radius:7px;cursor:pointer}</style></head><body><main><h1>竖向冬日音量键 · 12 秒循环成片</h1><p id="status">正在加载本地成片。</p><button id="restart">从头播放</button><section><video id="film" controls autoplay loop muted playsinline src="/out/x-vertical/winter-volume-portrait-loop.mp4"></video><div><p>四阶段配图</p><img src="/out/x-vertical/stages-1600x1000.png" alt="山脚热饮、松林出发、雪线招手、极光留影四阶段配图"><p>两个视频：竖版 1080×1350、方版 1080×1080。</p></div></section></main><script>
const film=document.getElementById('film'),status=document.getElementById('status');let previous=0,loops=0;
film.addEventListener('timeupdate',()=>{if(film.currentTime<previous-.5)loops++;previous=film.currentTime;status.textContent=`播放 ${film.currentTime.toFixed(2)} / ${film.duration.toFixed(2)} 秒 · 已循环 ${loops} 次 · ${film.videoWidth}×${film.videoHeight}`;document.body.dataset.loops=String(loops);});
film.addEventListener('error',()=>{status.textContent='成片播放失败';document.body.dataset.error='video';});
document.getElementById('restart').addEventListener('click',()=>{film.currentTime=0;previous=0;void film.play();});
</script></body></html>
